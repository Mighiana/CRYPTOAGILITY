# Synthetic long-lived client (fictional). Cannot be updated in place; offers classical groups only.
client: legacy-field-gateway
expected_lifetime_years: 15
tls:
  min_tls_version: TLSv1.2
  max_tls_version: TLSv1.2
  groups: [secp256r1]
  signature_algorithms: [rsa_pkcs1_sha256, ecdsa_secp256r1_sha256]
  cipher_suites: [AES-128-GCM]
